version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: portpin
    main: ./cmd/portpin
    binary: portpin
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      # Windows on arm64 is untested; v0.1 ships amd64 only there.
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
